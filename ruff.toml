line-length = 100
target-version = "py310"

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
]
ignore = [
    "E501",
    "N803",
]

[lint.isort]
known-first-party = ["datapure"]
force-sort-within-sections = true

[format]
quote-style = "double"
indent-style = "space"